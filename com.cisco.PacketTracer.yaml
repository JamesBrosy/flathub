app-id: com.cisco.PacketTracer
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: packettracer
rename-mime-file: com.cisco.PacketTracer-mime.xml
rename-mime-icons: [ pka, pks, pkt, pkz, pksz ]
separate-locales: false

tags: 
    - proprietary

finish-args:
  - --share=ipc
  - --share=network
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --persist=.

modules:
  - name: packettracer
    buildsystem: simple
    build-commands:
      - bsdtar -O -xf packettracer.deb data.* | bsdtar --no-same-owner -xf -
      - find opt/pt/saves opt/pt/templates opt/pt/templates/environments -type d -exec chmod 755 {} +
      - find opt/pt/saves opt/pt/templates opt/pt/templates/environments -type f -exec chmod 644 {} +
      - mv opt/pt ${FLATPAK_DEST}
      - sed -i -e 's\/opt/\/app/\g' ${FLATPAK_DEST}/pt/packettracer ${FLATPAK_DEST}/pt/linguist
      - install -Dpm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dpm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.url.desktop
      - install -Dpm644 -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps ${FLATPAK_ID}.png
      - install -Dpm644 -t ${FLATPAK_DEST}/share/metainfo ${FLATPAK_ID}.metainfo.xml
      - install -Dpm755 -t ${FLATPAK_DEST}/bin packettracer
      - install -Dpm644 -t ${FLATPAK_DEST}/share/mime/packages ${FLATPAK_ID}-mime.xml
      - mv usr/share/icons/gnome/48x48 ${FLATPAK_DEST}/share/icons/hicolor

    sources:
      - type: file
        path: packettracer.deb
        sha256: 6cd2b8891df92d2cad8b6fdc47480fc089de085c4f3fe95eb80d5450a2a7f72d
      - type: script
        commands:
          - exec /app/pt/packettracer
            "$@"
        dest-filename: packettracer
      - type: file
        path: com.cisco.PacketTracer.metainfo.xml
      - type: file
        path: com.cisco.PacketTracer.desktop
      - type: file
        path: com.cisco.PacketTracer.url.desktop
      - type: file
        path: com.cisco.PacketTracer.png
      - type: file
        path: com.cisco.PacketTracer-mime.xml
