app-id: is.folo.Folo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: run.sh
separate-locales: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: Folo
    buildsystem: simple
    build-commands:
      - install -Dm755 -t ${FLATPAK_DEST}/bin apply_extra
      - install -Dm755 -t $FLATPAK_DEST/bin run.sh
      - install -Dm644 -t ${FLATPAK_DEST}/share/applications ${FLATPAK_ID}.desktop
      - install -Dm644 -t ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/ ${FLATPAK_ID}.png
      - install -Dm644 -t $FLATPAK_DEST/share/metainfo ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: extra-data
        only-arches: [x86_64]
        url: https://github.com/RSSNext/Folo/releases/download/desktop/v1.13.0/Folo-1.13.0-linux-x64.deb
        sha256: 2e093644037a2b4aca8c85b617084e5e3e39b8889ed87eac2588f3f12f7845b6
        filename: folo.deb
        size: 109775538
        x-checker-data:
          type: json
          url: https://api.github.com/repos/RSSNext/Folo/releases/latest
          tag-query: .tag_name
          version-query: $tag | match("[0-9]+\\.[0-9]+\\.[0-9]+").string
          url-query: .assets[] | select(.name=="Folo-" + $version + "-linux-x64.deb")
            | .browser_download_url
          timestamp-query: .published_at
      - type: script
        dest-filename: run.sh
        commands:
          - exec zypak-wrapper /app/extra/Folo/Folo --no-sandbox --disable-setuid-sandbox
            "$@"
      - type: script
        dest-filename: apply_extra
        commands:
          - bsdtar -O -xf folo.deb data.* | bsdtar --no-same-owner -xf -
          - mv usr/lib/folo Folo
          - rm -rf folo.deb usr
      - type: file
        path: is.folo.Folo.desktop
      - type: file
        path: is.folo.Folo.png
      - type: file
        path: is.folo.Folo.metainfo.xml
